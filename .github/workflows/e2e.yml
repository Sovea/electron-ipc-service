name: Verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm run test:types
      - run: pnpm run test:e2e:types
      - run: pnpm run test:e2e:runner
      - run: pnpm run pack:check
      - run: pnpm run check:ci

  e2e-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: E2E PR (${{ matrix.os }}, Electron ${{ matrix.electron }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron: minimum
          - os: ubuntu-latest
            electron: current
          - os: windows-latest
            electron: current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: pnpm run test:e2e:install-deps
      - name: Run E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Run E2E
        if: runner.os != 'Linux'
        run: pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-${{ matrix.os }}-${{ matrix.electron }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-release:
    if: github.event_name == 'push'
    name: E2E release (${{ matrix.os }}, Electron ${{ matrix.electron }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron: minimum
          - os: ubuntu-latest
            electron: current
          - os: windows-latest
            electron: minimum
          - os: windows-latest
            electron: current
          # Electron 28 exits with SIGTRAP on GitHub-hosted macOS runners.
          - os: macos-26
            electron: current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: pnpm run test:e2e:install-deps
      - name: Run E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Run E2E
        if: runner.os != 'Linux'
        run: pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-${{ matrix.os }}-${{ matrix.electron }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-stress:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: E2E stress (Ubuntu, Electron current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:e2e:install-deps
      - run: xvfb-run -a pnpm run test:e2e:stress
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stress-ubuntu-current
          path: |
            playwright-report
            test-results
          retention-days: 7
