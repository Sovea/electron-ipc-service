name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile to run
        required: true
        default: pr
        type: choice
        options:
          - pr
          - release
          - stress

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm run test:types
      - run: pnpm run test:e2e:types
      - run: pnpm run test:e2e:runner
      - run: pnpm run test:package
      - run: pnpm run check:ci

  e2e-pr:
    if: >-
      (github.event_name == 'pull_request' &&
      !((github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')) ||
      contains(github.event.pull_request.labels.*.name, 'release'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'pr')
    name: E2E PR (${{ matrix.os }}, Electron ${{ matrix.electron }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron: minimum
          - os: ubuntu-latest
            electron: current
          - os: windows-latest
            electron: current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: pnpm run test:e2e:install-deps
      - name: Run E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Run E2E
        if: runner.os != 'Linux'
        run: pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-pr-${{ matrix.os }}-${{ matrix.electron }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-release:
    if: >-
      (github.event_name == 'pull_request' &&
      ((github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')) ||
      contains(github.event.pull_request.labels.*.name, 'release'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'release')
    name: E2E release (${{ matrix.os }}, Electron ${{ matrix.electron }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron: minimum
          - os: ubuntu-latest
            electron: current
          - os: windows-latest
            electron: minimum
          - os: windows-latest
            electron: current
          # Electron 28 exits with SIGTRAP on GitHub-hosted macOS runners.
          - os: macos-26
            electron: current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: pnpm run test:e2e:install-deps
      - name: Run E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Run E2E
        if: runner.os != 'Linux'
        run: pnpm run test:e2e
        env:
          E2E_ELECTRON_VERSION: ${{ matrix.electron }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-release-${{ matrix.os }}-${{ matrix.electron }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-stress:
    if: >-
      (github.event_name == 'pull_request' &&
      ((github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')) ||
      contains(github.event.pull_request.labels.*.name, 'release'))) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.profile == 'release' || inputs.profile == 'stress'))
    name: E2E stress (Ubuntu, Electron current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:e2e:install-deps
      - run: xvfb-run -a pnpm run test:e2e:stress
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-stress-ubuntu-current
          path: |
            playwright-report
            test-results
          retention-days: 7

  verification-gate:
    if: always()
    name: Verification gate
    needs: [quality, e2e-pr, e2e-release, e2e-stress]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected verification profile
        env:
          E2E_PR_RESULT: ${{ needs.e2e-pr.result }}
          E2E_RELEASE_RESULT: ${{ needs.e2e-release.result }}
          E2E_STRESS_RESULT: ${{ needs.e2e-stress.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE_PR: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')) || contains(github.event.pull_request.labels.*.name, 'release')) }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERIFY_PROFILE: ${{ inputs.profile }}
        run: |
          require_success() {
            if [[ "$2" != "success" ]]; then
              echo "$1 did not succeed: $2" >&2
              exit 1
            fi
          }

          require_success quality "$QUALITY_RESULT"
          if [[ "$IS_RELEASE_PR" == "true" ]] ||
             [[ "$EVENT_NAME" == "workflow_dispatch" && "$VERIFY_PROFILE" == "release" ]]; then
            require_success e2e-release "$E2E_RELEASE_RESULT"
            require_success e2e-stress "$E2E_STRESS_RESULT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$VERIFY_PROFILE" == "stress" ]]; then
            require_success e2e-stress "$E2E_STRESS_RESULT"
          elif [[ "$EVENT_NAME" == "pull_request" ]] ||
               [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            require_success e2e-pr "$E2E_PR_RESULT"
          fi
